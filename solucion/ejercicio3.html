<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de productos</title>
</head>
<body>
    <h1>Inventario de Productos</h1>

    <form action="" id="formulario">
        <label for="producto">Nombre del producto:</label>
        <input type="text" id="producto" required>

        <label for="precio">Precio Unitario:</label>
        <input type="number" id="precio" min="0.01" step="0.01" required>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" step="1" required>
        
        <button type="button" id="btnAgregar" onclick="agregarProducto()">Agregar Producto</button>
    </form>

    <h2>Productos Registrados</h2>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>

            </tr>
        </thead>
        <tbody id="tabla">
        </tbody>
    </table>
    <h2>Resultados</h2>
    <p id="total"></p>


    <script src="js/ejercicio3.js"></script>

</body>
</html>
